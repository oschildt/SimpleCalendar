<!doctype html>
<html lang="en" style="height: 100%">
    <head>
        <title>Calendar</title>

        <meta http-equiv="content-type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <script src="calendar.js"></script>

        <link rel="stylesheet" href="calendar.css" type="text/css" />
        <link rel="stylesheet" href="examples.css" type="text/css" />

        <script>
            var config = {
                format: 'd.m.Y',
                holidays: [new Date(Date.now() + 2 * 24 * 60 * 60 * 1000)],
                start_year: 1970,
                end_year: 2030,
            };

            window.onload = function () {
                SimpleCalendar.observe_escape();

                SimpleCalendar.assign('#begin_date', config);
                SimpleCalendar.assign('#end_date', config);

                SimpleCalendar.assign('#date1', config);
                SimpleCalendar.assign('#date2', config);
            };
        </script>
    </head>

    <body>
        <table style="width: 100%; height: 100%">
            <tr>
                <td class="header"></td>
            </tr>
            <tr>
                <td style="vertical-align: top; text-align: center">
                    <input type="text" name="date1" id="date1" />
                </td>
            </tr>

            <tr>
                <td style="vertical-align: middle; text-align: center">
                    <h1>Calendar demonstration</h1>

                    <br />
                    <br />
                    <br />
                    <br />
                    <br />
                    <br />
                    <br />
                    <br />
                        Scroll down
                    <br />
                    <br />
                    <br />
                    <br />
                    <br />
                    <br />
                    <br />
                    <br />

                    <table style="margin: 0 auto">
                        <tr>
                            <td><input type="text" name="begin_date" id="begin_date" value="30.12.1998" /></td>
                        </tr>
                        <tr>
                            <td><input type="text" name="end_date" id="end_date" /></td>
                        </tr>
                    </table>

                    <br />
                    <br />
                    <br />
                    <br />
                    <br />
                    <br />
                    <br />
                    <br />
                    <br />
                    <br />
                    <br />
                        Scroll down
                    <br />
                    <br />
                    <br />
                    <br />
                    <br />
                    <br />
                    <br />
                    <br />
                    <br />
                    <br />
                    <br />
                </td>
            </tr>

            <tr>
                <td style="vertical-align: bottom; text-align: center">
                    <input type="text" name="date2" id="date2" />
                </td>
            </tr>
        </table>
    </body>
</html>
