<!doctype html>
<html lang="en" style="height: 100%">
    <head>
        <title>Calendar</title>
        <meta http-equiv="content-type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <script src="calendar.js"></script>

        <link rel="stylesheet" href="calendar.css" type="text/css" />
        <link rel="stylesheet" href="examples.css" type="text/css" />

        <script>
            var config = {
                format: 'd.m.Y',
                holidays: [new Date(Date.now() + 2 * 24 * 60 * 60 * 1000)],
                start_year: 1970,
                end_year: 2030,
            };

            window.onload = function () {
                SimpleCalendar.observe_escape();

                var begin_date = document.getElementById('begin_date');

                SimpleCalendar.assign(begin_date, config);
                SimpleCalendar.assign('#end_date', config);

                SimpleCalendar.assign('#date11', config);
                SimpleCalendar.assign('#date12', config);
                SimpleCalendar.assign('#date21', config);
                SimpleCalendar.assign('#date22', config);
            };
        </script>
    </head>

    <body style="height: 100%; padding: 0; margin: 0">
        <table style="width: 100%; height: 100%">
            <tr>
                <td class="header" colspan="3"></td>
            </tr>
            <tr>
                <td style="vertical-align: top; text-align: left"><input type="text" name="date11" id="date11" /> left top</td>
                <td style="text-align: center">
                    <h1>Calendar demonstration</h1>

                    <table style="margin: 0 auto">
                        <tr>
                            <td><input type="text" name="begin_date" id="begin_date" value="30.12.1998" /></td>
                            <td><input type="text" name="end_date" id="end_date" /></td>
                        </tr>
                    </table>
                </td>
                <td style="vertical-align: top; text-align: right">right top <input type="text" name="date12" id="date12" /></td>
            </tr>
            <tr>
                <td style="vertical-align: bottom; text-align: left"><input type="text" name="date21" id="date21" /> left bottom</td>
                <td></td>
                <td style="vertical-align: bottom; text-align: right">right bottom <input type="text" name="date22" id="date22" /></td>
            </tr>
        </table>
    </body>
</html>
